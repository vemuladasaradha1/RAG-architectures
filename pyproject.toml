[build-system]
requires=['hatchling']
build-backend='hatchling.build'
[project]
name='rag-architectures'
version='0.1.0'
description='Modular local-first implementations and notebooks for major RAG architectures.'
readme='README.md'
requires-python='>=3.10'
dependencies=[]
[project.optional-dependencies]
notebooks=['jupyterlab>=4','nbformat>=5.10']
production=['fastapi>=0.115','uvicorn[standard]>=0.30','qdrant-client>=1.12','sentence-transformers>=3.3','transformers>=4.45','torch>=2.4','rank-bm25>=0.2.2','langchain>=0.3','langgraph>=0.2']
dev=['pytest>=8','ruff>=0.8','mypy>=1.13']
[tool.pytest.ini_options]
pythonpath=['src']
[tool.ruff]
line-length=100
[tool.ruff.lint]
ignore=['E401','E501','E701','E702']
