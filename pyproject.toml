[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-architectures"
version = "0.2.0"
description = "LangChain-based, modular implementations and notebooks for 16 RAG architectures."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "langchain>=1.4,<2",
  "langchain-core>=1.6,<2",
  "langchain-text-splitters>=1.1,<2",
  "langchain-community>=0.4,<0.5",
  "rank-bm25>=0.2.2,<0.3",
]

[project.optional-dependencies]
notebooks = ["jupyterlab>=4,<5", "nbformat>=5.10,<6", "nbclient>=0.10,<1"]
production = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "qdrant-client>=1.12",
  "sentence-transformers>=3.3",
  "transformers>=4.45",
  "torch>=2.4",
  "langgraph>=0.2",
]
dev = ["pytest>=8,<10", "ruff>=0.8,<1", "mypy>=1.13,<2"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["E501"]
